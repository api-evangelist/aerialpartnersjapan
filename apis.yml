aid: aerialpartnersjapan
name: Aerial Partners
description: 'Aerial Partners (株式会社Aerial Partners, Roppongi, Minato-ku, Tokyo) builds digital-asset
  accounting, tax and data-management software for the Japanese market. Its current product line is
  AWA (Aerial Web3 Accounting), an accounting-support tool for Web3 businesses handling crypto assets
  and NFTs, and ADM (Aerial Data Management), a management-accounting and statutory-ledger data
  platform for crypto-asset exchange operators and Type I financial instruments business operators.
  The company also resells Lukka Insights, the crypto data platform of its parent, Lukka, which
  acquired Aerial Partners in January 2025. Aerial Partners originated Gtax, the consumer and tax-accountant
  crypto profit-and-loss calculator, and Guardian, its tax-filing support service; both moved to
  株式会社Gtax, which pafin acquired in July 2026 and is folding into Cryptact on 5 October 2026.
  Aerial Partners publishes no public developer portal, API reference or machine-readable contract:
  the only API it markets is the "Gtax Network API", a joint-development BtoBtoC offering for exchange
  operators reachable only through the corporate inquiry form.'
